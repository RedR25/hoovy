services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hoovy
      POSTGRES_PASSWORD: hoovy
      POSTGRES_DB: hoovy
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoovy"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://hoovy:hoovy@db:5432/hoovy
      SECRET_KEY: dev-only-not-secret
      CORS_ORIGINS: '["http://localhost:8000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
